name: Public compute job
on:
  push:
    branches: ['jobs/**']
    paths: [job.json]
permissions:
  contents: read
concurrency:
  group: public-compute-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      kind: ${{ steps.job.outputs.kind }}
      id: ${{ steps.job.outputs.id }}
    steps:
      - name: Checkout published input
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate public job declaration
        id: job
        run: python3 scripts/check_job.py
  python:
    needs: validate
    if: needs.validate.outputs.kind == 'python-stdlib' || needs.validate.outputs.kind == 'python-science'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install scientific Python when requested
        if: needs.validate.outputs.kind == 'python-science'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: profiles/python-science-requirements.txt
      - name: Install pinned science packages
        if: needs.validate.outputs.kind == 'python-science'
        run: python -m pip install -r profiles/python-science-requirements.txt
      - name: Execute public code and emit verifiable receipt
        run: python3 scripts/run_python.py
      - name: Preserve output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: result-${{ needs.validate.outputs.id }}
          path: result/
          if-no-files-found: warn
          retention-days: 1
  lean-core:
    needs: validate
    if: needs.validate.outputs.kind == 'lean-core'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reject admitted or unsafe local proofs
        run: python3 scripts/check_proof.py profiles/lean-core/Proof.lean
      - name: Lean kernel build with GitHub cache
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        id: compile
        with:
          lake-package-directory: profiles/lean-core
          auto-config: false
          build: true
          test: false
          use-github-cache: true
          use-mathlib-cache: false
      - name: Write compile receipt
        if: always()
        env:
          PROOF_KIND: lean-core
          BUILD_OUTCOME: ${{ steps.compile.outcome }}
        run: python3 scripts/lean_receipt.py
      - name: Preserve proof receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: result-${{ needs.validate.outputs.id }}
          path: result/
          if-no-files-found: warn
          retention-days: 1
  lean-mathlib:
    needs: validate
    if: needs.validate.outputs.kind == 'lean-mathlib'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reject admitted or unsafe local proofs
        run: python3 scripts/check_proof.py profiles/lean-mathlib/Proof.lean
      - name: Lean and Mathlib build with caches
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        id: compile
        with:
          lake-package-directory: profiles/lean-mathlib
          auto-config: false
          build: true
          test: false
          use-github-cache: true
          use-mathlib-cache: true
      - name: Write compile receipt
        if: always()
        env:
          PROOF_KIND: lean-mathlib
          BUILD_OUTCOME: ${{ steps.compile.outcome }}
        run: python3 scripts/lean_receipt.py
      - name: Preserve proof receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: result-${{ needs.validate.outputs.id }}
          path: result/
          if-no-files-found: warn
          retention-days: 1
